# Every push and pull request: both test suites with the fake models (no GPU, no model download), then the Docker
# image is built, checked for private files, and the compose demo is started once (design D11, D14).
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATEGORY_MODEL: fake
      ATTRIBUTES_MODEL: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "tests/*.test.cjs"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t receipt-demo .
      - name: The image holds no private files
        run: |
          docker run --rm --entrypoint sh receipt-demo -c '
            for path in /app/rawdata /app/data /app/.env /app/models /app/src/web; do
              if [ -e "$path" ]; then echo "found $path"; exit 1; fi
            done
            found=$(find /app \( -name "*.csv" -o -name "*.rar" -o -name "*.zip" -o -name "*.7z" -o -name ".env*" \) -print)
            if [ -n "$found" ]; then echo "$found"; exit 1; fi'
      - name: The compose demo starts, is in demo mode and lists its demo users
        run: |
          docker compose up -d --build
          ready=no
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/health | grep -q '"demo_mode":true'; then
              ready=yes
              break
            fi
            sleep 2
          done
          if [ "$ready" != yes ]; then
            echo "the demo never answered /api/health with demo_mode on"
            docker compose logs
            exit 1
          fi
          if ! curl -fsS --max-time 5 http://127.0.0.1:8000/api/auth/demo-users \
              | python3 -c "import json, sys; assert json.load(sys.stdin)"; then
            echo "/api/auth/demo-users listed nobody"
            docker compose logs
            exit 1
          fi
      - name: Stop the demo and drop its volumes
        if: always()
        run: docker compose down -v
